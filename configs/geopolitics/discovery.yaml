# The ONE config every `make` target uses. Ships paper-safe: the fleet is
# enabled but every bot is armed dry_run -- it discovers,
# grades, scans, alerts, and paper-trades the whole geopolitical universe
# without being able to move a cent.
#
# Going live is a deliberate two-line change (see QUICKSTART.md):
#   fleet.position_mode: "live"
#   fleet.auto_ack: true
# ...then `make live`. Master kill switch at any time: `make halt`.

universe:
  # 0 is uncapped. Gamma's keyset cursor is followed to exhaustion; every
  # run emits a content-addressed COMPLETE/INCOMPLETE coverage manifest.
  max_events: 0
  page_size: 100
  fail_on_truncation: true
  enumeration_views:
    - order: liquidity
      ascending: false
    - order: volume
      ascending: false
    - order: startDate
      ascending: false
    - order: endDate
      ascending: true
  # Liquidity/volume floors are OFF: liquidity sizes orders, never
  # disqualifies a market.
  min_liquidity: 0.0
  min_volume: 0.0
  max_days_to_deadline: 365.0

scoring:
  min_rule_text_chars: 200
  # Discretionary rules stay barred from live FOREVER, but reach paper so the
  # soak can measure whether the classifier reads them correctly. Unblocks the
  # US-Iran announcement ladders (blockade-end, halt-in-offensive): clarity
  # 0.78 / observability 0.90, gated only by the word "generally" in the rules.
  allow_discretionary_paper: true
  min_clarity_live: 0.75
  min_clarity_paper: 0.55
  min_observability_live: 0.7
  min_observability_paper: 0.5
  min_automation_live: 0.7
  max_resolution_risk_live: 0.35
  min_liquidity_live: 0.0
  min_liquidity_paper: 0.0
  small_live_liquidity_fraction: 0.02
  small_live_min_order_usd: 5.0
  max_spread_live: 0.10
  max_days_to_deadline_live: 180.0
  max_markets_per_correlation_group: 2

opportunity:
  # Record model probabilities, market mids, and realized outcomes without
  # allowing model-priced allocation. Promotion to "allocatable" is explicit
  # and config loading then requires the weight/buffer equation to be reachable.
  # Confirmation bots and grouped-market consistency arbitrage are separate.
  model_pricing_mode: calibration_only
  min_edge: 0.05
  slippage_buffer: 0.01
  resolution_risk_buffer: 0.02
  model_uncertainty_buffer: 0.03
  max_entry_price: 0.90
  max_spread: 0.15
  # Market-anchored pricing: edges are computed from
  # model_weight*model + (1-model_weight)*market_mid. The market's own price
  # is the benchmark estimator until calibration-report proves otherwise.
  # With the current 0.25 disagreement scale and 0.06 fixed buffers,
  # allocatable mode needs model_weight >= 0.36 even before per-market risk.
  model_weight: 0.35
  # Edge bar widens by |model - mid| * this: big disagreements with the
  # crowd demand more edge.
  disagreement_buffer_scale: 0.25
  # Forecast-engine probabilities cannot size live opportunities until
  # calibration-report shows they beat the market's Brier over this many
  # resolved outcomes.
  require_calibrated_forecast: true
  min_resolved_for_calibration: 20
  # Price BOTH sides of every outcome; overpriced markets are edge too.
  scan_no_side: true
  # Grouped events whose YES prices don't sum to ~1 are reported as
  # arbitrage (the market arguing with itself).
  min_group_arb_edge: 0.02
  # Per-market resolution risk widens the buffer beyond the flat base.
  resolution_risk_scale: 0.05
  # Operator estimates: market_id -> outcome -> p. Flag event-arrival
  # estimates with {_decay: true, _as_of: "<ISO date>"} so they shrink with
  # remaining time instead of silently going stale.
  probability_estimates: {}
  forecast_data_root: "data/geopolitics"
  forecast_max_age_hours: 24.0

schedule:
  interval_minutes: 60.0

fleet:
  enabled: true
  # <= 0 means UNCAPPED: one bot per eligible market, deep or thin.
  max_bots: 0
  # dry_run = the paper soak. Change to "live" + auto_ack: true only
  # after the funnel/calibration reports justify it.
  position_mode: "dry_run"
  auto_ack: false
  generated_dir: "configs/geopolitics/generated"
  # Hung-bot detection + crash-loop brake.
  heartbeat_stale_seconds: 300
  max_restarts_per_hour: 3

# One process polls the union of every managed market's RSS/Atom sources and
# fans matching rows to market bots through durable per-feed cursors. This
# prevents common feeds from being requested once per bot every 2 seconds.
central_feed:
  enabled: true
  db_path: "data/discovery/central_feed.sqlite3"
  poll_seconds: 2.0
  max_workers: 12
  max_entries_per_feed: 50
  # Required settlement sources without a working feed use centralized
  # conditional-GET sitemap/JSON/listing discovery. This never grants a source
  # authority role; the immutable SourcePlan still controls that.
  direct_sources_enabled: true
  direct_poll_seconds: 2.0
  # Unchanged endpoints back off exponentially, then return to 2s as soon
  # as a newly inserted item appears.
  direct_idle_max_seconds: 30.0
  max_entries_per_direct_source: 20
  # Aggregator queries are numerous and already have indexing latency; rotate
  # a bounded slice per domain instead of bursting every query concurrently.
  aggregator_poll_seconds: 30
  max_urls_per_domain_per_cycle: 8
  retention_hours: 72
  # Market bots stop consuming the shared feed when its producer heartbeat
  # is stale. They do not fall back to direct feed requests.
  stale_after_seconds: 60

# One WAL-backed reservation counter is shared by every generated market bot.
# Counts are actual model calls: one screen + one paper confirm consumes 2;
# one screen + two agreeing live confirms consumes 3. A confirm group is
# admitted atomically, so live can never spend only one half of a two-pass
# decision. The limits are fleet totals, not per-market allowances.
classifier_budget:
  enabled: true
  db_path: "data/discovery/classifier_budget.sqlite3"
  max_escalations_per_hour: 60
  max_escalations_per_day: 500
  max_classifier_errors_per_hour: 20
  # Atomic global sub-quotas: incumbent evidence, cold-start exploration, and
  # rule compilation/retries/safety work. No process may borrow by starting
  # earlier than another.
  exploitation_fraction: 0.70
  exploration_fraction: 0.20
  system_fraction: 0.10

profit_priority:
  enabled: true
  policy_version: rules-first-profit-priority-v1
  min_terminal_observations: 20
  min_human_labels: 100
  min_quote_samples: 20
  min_stressed_fill_samples: 20
  min_resolved_trades: 5
  lower_bound_z: 1.96
  missing_label_error_rate: 0.05
  # Monetary model billing is not yet metered, so reserve one cent per
  # recorded model call and expose processing_cost_measured=false.
  processing_cost_reserve_usd: 0.01
  # A wrong terminal action can lose the entire current per-order budget.
  false_terminal_loss_usd: 50.0
  exploration_fraction: 0.20
  # The recorder currently samples through 10 seconds. A measured p95 beyond
  # that horizon blocks exploitation instead of assuming the quote survived.
  max_supported_latency_ms: 10000

# Compile verbatim market rules into a strict, versioned contract before a
# source plan or eligibility decision is trusted. Every new rule version uses
# two agreeing passes. Families remain paper-only until replay and forward
# evidence explicitly promote them below.
rule_compiler:
  enabled: true
  max_per_cycle: 10
  db_path: "data/discovery/rules.sqlite3"
  paper_families:
    - OCCURRENCE_BEFORE_DEADLINE
    - CATEGORICAL_EXCLUSIVE
    - SOURCE_LOCKED_ANNOUNCEMENT
    - STATUS_AT_DEADLINE
    - NUMERIC_THRESHOLD
    - DURATION_REQUIREMENT
  live_confirmation_families: []

# Generic RuleSpec-driven execution is enabled only for the paper fleet.
# The command rejects --live and fleet.position_mode=live. The three initial
# families may act on deterministic terminal evaluations; status/count/duration
# markets continue collecting claims, evaluations, and proofs without execution.
rule_runner:
  enabled: true
  paper_execution_families:
    - OCCURRENCE_BEFORE_DEADLINE
    - CATEGORICAL_EXCLUSIVE
    - SOURCE_LOCKED_ANNOUNCEMENT
  extraction_passes: 2
  deterministic_evidence_enabled: true
  deterministic_evidence_policy_version: "official-claim-envelope-v1"
  deterministic_evidence_families:
    - OCCURRENCE_BEFORE_DEADLINE
    - CATEGORICAL_EXCLUSIVE
    - SOURCE_LOCKED_ANNOUNCEMENT
  poll_seconds: 2.0
  max_articles_per_feed: 50
  max_trade_article_age_hours: 24.0
  # Generic entries require a current per-market Gamma feeSchedule snapshot.
  # Explicit feesEnabled=false is a verified zero-fee schedule; missing or
  # stale metadata blocks entry.
  max_fee_schedule_age_hours: 24.0
  # Legacy binary/location paper adapters still use a flat fee. The generic
  # runner rejects any nonzero value and uses the market fee curve instead.
  paper_fee_bps: 0.0
  paper_slippage_bps: 25.0
  paper_max_book_age_seconds: 10.0
  confirmation_uncertainty_buffer: 0.03
  exit_price_buffer: 0.01

# Public, credential-free forward recorder attached to the generic paper
# runner. It seeds every outcome book over REST, then maintains full depth
# through the market WebSocket with heartbeat/reconnect handling. Articles,
# extraction latency, decision proofs, resolutions, and quote survival are
# stored in one WAL database for content-addressed forward replays.
forward_recorder:
  enabled: true
  db_path: "data/discovery/forward_recorder.sqlite3"
  websocket_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  heartbeat_seconds: 10.0
  reconnect_min_seconds: 1.0
  reconnect_max_seconds: 30.0
  rest_seed: true
  shared_book_service: true
  max_tokens_per_connection: 200
  rest_seed_workers: 8
  max_book_levels: 20
  # Record books for every open market, not just the monitored/tradeable set.
  # Order books cannot be rebuilt after the fact, so a market left unrecorded
  # is permanently missing from the research record -- including the
  # MONITOR_ONLY and ungraded markets whose gradings the data is meant to
  # test. Recording confers no execution permission and never shrinks the
  # monitored set. Raise max_recorded_markets off 0 if the open universe
  # turns out large enough that connection count matters (200 tokens each).
  record_all_contexts: true
  max_recorded_markets: 0
  quote_survival_horizons_ms:
    - 100
    - 250
    - 500
    - 1000
    - 2000
    - 5000
    - 10000
  max_sample_lag_ms: 250

allocator:
  per_order_usd: 50.0
  per_market_usd: 100.0
  per_event_usd: 150.0
  per_group_usd: 200.0
  # Second correlation dimension: one theater cannot absorb the book.
  per_region_usd: 300.0
  daily_usd: 300.0
  total_usd: 1000.0
  max_open_positions: 5
  max_per_deadline_week_usd: 400.0
  # Portfolio kill switch: cumulative realized losses beyond this flip the
  # whole fleet to alert_only automatically.
  max_drawdown_usd: 150.0

classifier:
  # claude_cli routes ALL classification (rule analysis, screen tier,
  # confirm passes) through the Claude Code CLI using your Claude
  # SUBSCRIPTION -- no metered API billing. Requires `claude` installed and
  # logged in on this host (`claude login`); if ANTHROPIC_API_KEY is also
  # set in .env it becomes an automatic fallback when the CLI fails.
  # Alternatives: anthropic (metered API), rule_based (offline smoke tests).
  provider: claude_cli
  model: claude-opus-4-8
  cli_timeout_seconds: 180

# Autonomous probability estimation: the system's own P(YES) per tradeable
# binary market (rules + deadline + base rates, deliberately WITHOUT the
# market price in the prompt). Estimates are priced by every scan, scored
# by the calibration loop as markets resolve, and are barred from sizing
# live money until calibration-report proves they beat the market's Brier
# (opportunity.require_calibrated_forecast). Once forecast_calibrated flips
# true, raising opportunity.model_weight is the deliberate, evidence-backed
# step that lets the bot trade its own view.
estimator:
  # Probability forecasts are a separate calibration experiment and cannot
  # compete with terminal evidence for this campaign's model-call budget.
  enabled: false
  model: claude-sonnet-4-6
  refresh_hours: 24.0
  max_per_cycle: 25
  cli_timeout_seconds: 120

data_dir: data/discovery
logs_dir: logs
